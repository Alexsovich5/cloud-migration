version: "2"
name: cloud-migration

services:
  app:
    build: .
    image: cloud-migration:app
    platform: linux/amd64
    entrypoint: []
    volumes:
      - .:/app
    environment:
      - AWS_ACCESS_KEY_ID=testing
      - AWS_SECRET_ACCESS_KEY=testing
      - AWS_DEFAULT_REGION=us-east-1

networks:
  default:
    ipam:
      config:
        - subnet: 172.49.0.0/24
